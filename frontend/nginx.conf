# Front-end server (non-root nginx, port 8080 inside the container).
# Serves the Angular build and forwards the API to the back-end on the same origin.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Docker's DNS: "backend" is resolved per request, so nginx starts even before the back-end exists
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $api http://backend:8080;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Security headers: in a snippet, because a location with its own add_header drops the inherited ones
  include /etc/nginx/snippets/securite.conf;

  # API and health check, same origin: no CORS
  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $http_host;            # with the port: Spring then sees a same-origin request (no CORS check)
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;            # the HR assistant can think for a while
  }

  # Notifications stream (SSE): no buffering, long-lived connection
  location /api/notifications/flux {
    proxy_pass $api;
    proxy_set_header Host $http_host;            # with the port: Spring then sees a same-origin request (no CORS check)
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location = /actuator/health {
    proxy_pass $api;
    proxy_set_header Host $http_host;
  }

  # Hashed bundles never change: cache them for a year
  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/securite.conf;
    try_files $uri =404;
  }

  # Angular routes (/leave-requests/42…) all serve index.html, never cached
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/securite.conf;
    try_files $uri $uri/ /index.html;
  }
}
