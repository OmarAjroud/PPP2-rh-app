services:
  mysql:
    image: mysql:8.4
    container_name: rh-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rh_db
      MYSQL_USER: rh_user
      MYSQL_PASSWORD: rh_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - mysql

  mailpit:
    image: axllent/mailpit
    container_name: rh-mailpit
    ports:
      - "8025:8025"    # interface web (la boîte de réception de test)
      - "1025:1025"    # serveur SMTP

volumes:
  mysql_data:
