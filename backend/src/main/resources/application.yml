spring:
  application:
    name: rh
  datasource:
    url: jdbc:mysql://localhost:3306/rh_db?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: rh_user
    password: rh_pass
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway gère le schéma, Hibernate vérifie seulement
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  task:
    execution:
      thread-name-prefix: async-
      pool:
        core-size: 2
        max-size: 8
        queue-capacity: 100
      shutdown:
        await-termination: true
        await-termination-period: 15s

server:
  port: 8080

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:no-reply@rh-app.local}
    from-name: Application RH
  security:
    jwt:
      # En production : définir la variable d'environnement JWT_SECRET (jamais de secret réel dans Git)
      secret: ${JWT_SECRET:change-me-dev-only-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGH}
      access-token-minutes: 15
      refresh-token-days: 7
    cors:
      allowed-origins: http://localhost:4200
  seed:
    test-accounts: true            # crée les 4 comptes de test au démarrage (désactiver en production)
    test-password: "Test1234!"