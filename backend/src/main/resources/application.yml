
spring:
  application:
    name: rh
  datasource:
    url: jdbc:mysql://localhost:3306/rh_db?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: rh_user
    password: rh_pass
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway gère le schéma, Hibernate vérifie seulement
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: 8080