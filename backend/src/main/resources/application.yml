spring:
  application:
    name: rh
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/rh_db?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:rh_user}
    password: ${DB_PASSWORD:rh_pass}
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway gère le schéma, Hibernate vérifie seulement
    open-in-view: false
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    execution:
      thread-name-prefix: async-
      pool:
        core-size: 2
        max-size: 8
        queue-capacity: 100
      shutdown:
        await-termination: true
        await-termination-period: 15s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful                 # à l'arrêt : finir les requêtes en cours avant de couper

# Supervision : seul l'état de santé est exposé (utilisé par Docker), sans aucun détail interne
management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false               # emails envoyés en arrière-plan, au mieux : un SMTP absent ne rend pas l'application « malade »
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:no-reply@rh-app.local}
    from-name: Application RH
  leave:
    weekend-days: SATURDAY,SUNDAY    # jours non ouvrables (mettre SUNDAY seul si le samedi est travaillé)
  notifications:
    email-enabled: ${NOTIFICATIONS_EMAIL_ENABLED:true}   # un email accompagne chaque notification
  assistant:
    provider: ${ASSISTANT_PROVIDER:ollama}   # ollama (modèle local, gratuit) | claude (API, clé requise)
    max-iterations: 6                        # allers-retours modèle / outils par question
    ollama:
      url: ${OLLAMA_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen3:4b-instruct}   # sans « réflexion » : rapide, même sur processeur
      keep-alive: 30m                        # le modèle reste en mémoire entre deux questions
      num-ctx: 8192                          # contexte : outils + conversation + résultats
      timeout-seconds: 180                   # sur un portable sans carte graphique, une réponse peut être lente
    claude:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${CLAUDE_MODEL:claude-opus-5-5}
      effort: ${CLAUDE_EFFORT:medium}        # low | medium | high | xhigh | max
  security:
    login:
      max-failures: 5                   # échecs de connexion tolérés (même compte, même adresse IP)...
      window-minutes: 15                # ... sur cette durée, avant un refus temporaire (429)
    tokens:
      activation-hours: 48
      reset-minutes: 60
    jwt:
      # En production : définir la variable d'environnement JWT_SECRET (jamais de secret réel dans Git)
      secret: ${JWT_SECRET:change-me-dev-only-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGH}
      access-token-minutes: 15
      refresh-token-days: 7
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  seed:
    test-accounts: ${SEED_TEST_ACCOUNTS:true}   # crée les 4 comptes de test au démarrage (false en production)
    test-password: ${SEED_TEST_PASSWORD:Test1234!}